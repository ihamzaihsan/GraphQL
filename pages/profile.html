<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/profilestyle.css">
    <title>Profile - GraphQL</title>
    <!-- Add D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="profile-container">
        <!-- User Info Section -->
        <header>
            <button id="logoutBtn" class="logout-btn">Logout</button>
            <h1>Profile</h1>
            <div id="userInfo" class="user-info">
                <!-- User data will be populated here -->
            </div>
        </header>

        <!-- Statistics Section -->
        <section class="statistics">
            <h2>Statistics</h2>
            <div class="graphs-container">
                <!-- Premium XP Graph -->
                <div class="xp-master-container">
                    <div class="xp-graph-card">
                        <div class="graph-header">
                            <h3 class="graph-title">XP Progression</h3>
                            <div class="graph-legends">
                                <div class="legend-item">
                                    <span class="legend-color accent-gradient"></span>
                                </div>
                            </div>
                        </div>
                        <div class="xp-graph-container">
                            <svg class="xp-progression-svg" viewBox="0 0 800 400">
                                <defs>
                                    <linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1">
                                        <stop offset="0%" stop-color="rgba(0, 123, 255, 0.4)"/>
                                        <stop offset="100%" stop-color="rgba(0, 123, 255, 0.1)"/>
                                    </linearGradient>
                                </defs>
                                <path class="xp-path" d="" fill="url(#areaGradient)"/>
                                <path class="xp-line" d="" fill="none"/>
                                <g class="grid-x"></g>
                                <g class="grid-y"></g>
                                <g class="data-points"></g>
                            </svg>
                            <div class="xp-tooltip"></div>
                        </div>
                    </div>
                </div>

                <!-- Audit Ratio Graph (Keep existing structure) -->
                <div class="graph">
                    <h3>Audit Ratio</h3>
                    <svg id="auditGraph" class="stat-graph" viewBox="0 0 400 300">
                        <!-- SVG graph will be generated here -->
                    </svg>
                </div>
            </div>
            <div class="completed-projects-container">
                <h3>Completed Projects</h3>
                <div class="projects-table-container">
                    <table class="projects-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>XP Gained</th>
                                <th>Completed Date</th>
                                <th>Project</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rows will be populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script type="module" src="../js/profile.js"></script>
</body>
</html>
